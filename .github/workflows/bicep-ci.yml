name: Bicep Infrastructure CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-bicep:
    name: Build and Validate Bicep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bicep CLI
        run: |
          az bicep install
          az bicep version

      - name: Build main Bicep template
        run: az bicep build --file main.bicep --stdout > /dev/null

      - name: Build network Bicep template
        run: az bicep build --file network.bicep --stdout > /dev/null

  azure-auth-check:
    name: Authenticate to Azure using OIDC
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: validate-bicep
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure account
        run: |
          az account show --query "{Subscription:name, Tenant:tenantId, State:state}" --output table

      - name: Verify resource group access
        run: |
          az group show --name practice --query "{Name:name, Location:location, ProvisioningState:properties.provisioningState}" --output table
